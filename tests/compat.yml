- hosts: all
  gather_facts: false
  strategy: "{{ inspector }}"
  vars:
    answer: 42
  tasks:
    - name: inspect expression
      debug:
        msg: "{{ answer }}"
      changed_when: true
      notify: handler probe
    - name: loop probe
      debug:
        msg: "{{ item }}"
      loop: [one, two]
      when: item != 'never'
      loop_control:
        label: "label-{{ item }}"
        extended: true
        index_var: item_index
    - name: lookup loop probe
      debug:
        msg: "{{ item }}"
      with_items: [three, four]
    - name: template probe
      template:
        src: probe.j2
        dest: "{{ playbook_dir }}/.rendered-{{ inventory_hostname }}"
    - name: failure probe
      fail:
        msg: expected failure
    - name: after failure
      debug:
        msg: recovered
    - meta: flush_handlers
    - name: end probe
      debug:
        msg: done
  handlers:
    - name: handler probe
      debug:
        msg: handled
